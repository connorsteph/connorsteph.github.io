<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts - Connor Stephens</title>
    <meta name="description" content="Blog posts and technical writing by Connor Stephens.">
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="nav-placeholder"></div>

    <header class="base-header dynamic-header">
        <canvas id="dejongCanvas" data-system="clifford"></canvas>
        <div class="header-overlay">
            <h1>Posts</h1>
            <div class="header-controls">
                <button id="toggleControls" class="toggle-controls-button">Show Controls</button>
                <div id="controlsPanel" class="controls-panel hidden">
                    <div class="controls-header">
                        <h4>Dynamics Controls</h4>
                        <button id="closeControls" class="close-controls">×</button>
                    </div>
                    <div id="parameterControls" class="parameter-controls">
                        <!-- Parameter sliders will be dynamically generated -->
                    </div>
                    <button id="resetParams" class="reset-button">Reset Parameters</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="content">
            <div class="posts-intro">
                <p>A collection of technical posts, research notes, and occasional thoughts on mathematics, machine learning, and software development.</p>
            </div>

            <div class="posts-list">
                <!-- Posts will be dynamically loaded from posts.json -->
                <p>Loading posts...</p>
            </div>
        </section>

        <div class="back-link">
            <a href="/">← Back to Home</a>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="/js/darkmode.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/systems.js"></script>
    <script src="/js/header.js"></script>
    <script src="/js/posts.js"></script>
</body>
</html>
