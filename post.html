<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">

    <!-- MathJax Configuration -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                tags: 'ams'  // Enable automatic equation numbering (AMS style)
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>

    <!-- Marked.js for markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div id="nav-placeholder"></div>

    <main class="page">
        <div class="running"><span>Notes</span><span></span></div>

        <section class="hero">
            <div class="header-overlay"><h1>Loading...</h1></div>
            <div class="post-meta">
                <div class="post-date"></div>
                <div class="post-category"></div>
                <div class="post-tags"></div>
            </div>
        </section>

        <section class="content" id="post-content">
            <p>Loading post...</p>
        </section>

        <div class="back-link">
            <a href="/posts.html">← Back to Notes</a>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="/js/nav.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/post-renderer.js"></script>
</body>
</html>
